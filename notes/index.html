<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>malakai h · portfolio</title>
  <meta name="description" content="mathematical physics @ unimelb. i build models, break equations, and bomb exams." />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔬</text></svg>" />
  <style>
    /* ── Notes-page-specific styles ─────────────────── */
    /* Move these to style.css if you find yourself
       reusing them on other pages.                       */

    /* Year divider */
    .year-group { margin-bottom: var(--space-12); }
    .year-label {
      font-size: var(--text-xs);
      font-family: var(--font-mono);
      color: var(--ink-faint);
      margin-bottom: var(--space-4);
      padding-bottom: var(--space-2);
      border-bottom: 1px solid var(--ink-faint);
    }

    /* Search box */
    .notes-search {
      width: 100%;
      max-width: 420px;
      padding: var(--space-3) var(--space-4);
      background: var(--cream-mid);
      border: 1.5px solid var(--ink-faint);
      border-radius: var(--radius-sm);
      font-size: var(--text-base);
      font-family: var(--font-sans);
      color: var(--ink);
      margin-bottom: var(--space-8);
      transition: border-color var(--duration) var(--ease);
    }
    .notes-search:focus {
      outline: none;
      border-color: var(--sage);
    }
    .notes-search::placeholder { color: var(--ink-faint); }
  </style>
</head>
<body>

  <header class="nav">
    <div class="container nav__inner">
      <a href="../" class="nav__logo">kaiwave<span>.dev</span></a>
      <nav class="nav__links">
        <a href="../" data-i18n="home">home</a>
        <a href="../projects" data-i18n="projects">projects</a>
        <a href="../notes" data-i18n="notes">notes</a>
        <a href="../about" data-i18n="about">about</a>
        <a href="../contact" data-i18n="contact">contact</a>
      </nav>
      <button class="language-toggle" id="language-toggle" type="button" aria-label="Change language">
        <span data-language-label="en">EN</span><span aria-hidden="true">/</span><span data-language-label="fr">FR</span>
      </button>
      <button class="nav__toggle" id="nav-toggle" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main class="container">
    <div class="page-header">
      <p class="page-header__tag" data-i18n="notesTag">// linkedin write-ups</p>
      <h1 class="page-header__title" data-i18n="notes">posts</h1>
      <p class="page-header__sub" data-i18n="notesdesc">
        Some write-ups, thoughts, and lessons that I’ve learned throughout my life. Inspired constantly by the world and people around me. 
      </p>
    </div>

    <input
      type="search"
      class="notes-search"
      id="notes-search"
      placeholder="search notes…"
      data-i18n-placeholder="searchNotes"
      aria-label="Search notes"
    />

    <div class="notes-list" id="notes-list"></div>

  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span>© 2026 malakai h</span>
      <span data-i18n="builtWith">built with html + css + love</span>
    </div>
  </footer>

  <script src="../js/notes-data.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
