<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>malakai h · portfolio</title>
  <meta name="description" content="mathematical physics @ unimelb. i build models, break equations, and bomb exams." />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔬</text></svg>" />
</head>
<body>

  <header class="nav">
    <div class="container nav__inner">
      <a href="../" class="nav__logo">kaiwave<span>.dev</span></a>
      <nav class="nav__links">
        <a href="../" data-i18n="home">home</a>
        <a href="../projects" data-i18n="projects">projects</a>
        <a href="../notes" data-i18n="notes">notes</a>
        <a href="../about" data-i18n="about">about</a>
        <a href="../contact" data-i18n="contact">contact</a>
      </nav>
      <button class="language-toggle" id="language-toggle" type="button" aria-label="Change language">
        <span data-language-label="en">EN</span><span aria-hidden="true">/</span><span data-language-label="fr">FR</span>
      </button>
      <button class="nav__toggle" id="nav-toggle" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main class="container">
    <!-- Page header -->
    <div class="page-header">
      <p class="page-header__tag" data-i18n="projectsTag">// what i've been building (js needs to be enabled)</p>
      <h1 class="page-header__title" data-i18n="projects">projects</h1>
      <p class="page-header__sub" data-i18n="projectSub">
        Research, simulations, models, data explorations, and tools I've published or am working on.
        Most live on GitHub or my cloud.
      </p>
    </div>

    <!-- ====================================================
         FILTER BAR
         ↓ Add/remove filter buttons to match your actual tags.
           Each button's data-filter must match a tag used in
           data-tags on the project cards below.
    ==================================================== -->
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all" data-i18n="all">all</button>
      <button class="filter-btn" data-filter="research">research</button>
      <button class="filter-btn" data-filter="python">python</button>
      <button class="filter-btn" data-filter="data">data</button>
      <button class="filter-btn" data-filter="rust">rust</button>
      <button class="filter-btn" data-filter="sport">sport</button>
      <button class="filter-btn" data-filter="visualisation">visualisation</button>
      <button class="filter-btn" data-filter="environment">environment</button>
    </div>

    <!-- ====================================================
         PROJECT CARDS
    ==================================================== -->

    <div id="projects-grid" class="projects-grid"></div>

    <div style="display:flex; justify-content:center; margin-top:1.5rem;">
      <button id="toggle-projects-view" class="btn btn--ghost" type="button" hidden>Show all</button>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span>© 2026 malakai h</span>
      <span data-i18n="builtWith">built with html + css + love</span>
    </div>
  </footer>

  <script src="../js/projects-data.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
